<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到广东惠州</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* 浅蓝色背景，象征湖泊和海洋 */
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1e6bb8; /* 深蓝色，与惠州的水景相呼应 */
            margin-bottom: 20px;
        }
        p {
            line-height: 1.8;
            font-size: 18px;
            margin-bottom: 25px;
            text-align: left; /* 段落文字左对齐，更易读 */
        }
        .highlight {
            color: #e74c3c; /* 红色高亮重点 */
            font-weight: bold;
        }
        .huizhou-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            border: 3px solid #1e6bb8;
        }
        .signature {
            margin-top: 30px;
            font-style: italic;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 欢迎来到广东惠州！ 🌴</h1>
        <img class="huizhou-image" src="https://images.unsplash.com/photo-1599631325184-3c149ac4ce78?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aHVpemhvdSUyMGNoaW5hfGVufDB8fDB8fHww&w=1000&q=80" alt="惠州西湖风景">
        <p>惠州，一座美丽的滨海城市，坐落于珠江三角洲东北端。这里素有“岭南名郡”、“半城山色半城湖”的美誉。</p>
        <p>您可以漫步在<span class="highlight">惠州西湖</span>的苏堤上，感受“浓抹杭州惠淡妆”的诗意；也可以前往<span class="highlight">巽寮湾</span>和<span class="highlight">双月湾</span>，在洁白的沙滩和湛蓝的海水中尽情放松。</p>
        <p>除了迷人的自然风光，惠州还有丰富的历史文化，如<span class="highlight">罗浮山</span>的道教文化和<span class="highlight">东坡纪念馆</span>的文人足迹，都值得您细细探寻。</p>
        <p>欢迎您来惠州，感受这座城市的山水之美、海洋之阔与人文之韵！</p>
        <p class="signature">—— 期待您的光临</p>
    </div>
</body>
</html>
